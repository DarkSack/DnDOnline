name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dndonline
          POSTGRES_PASSWORD: dndonline-dev
          POSTGRES_DB: dndonline
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U dndonline" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint -w @dndonline/web
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # La misma E2E contra la pila de producción (Docker + Caddy con su CSP), que Vite no reproduce.
      - name: Pila de producción
        run: docker compose -f docker-compose.prod.yml up -d --build --wait
        env:
          POSTGRES_PASSWORD: solo-para-ci
          PUBLIC_ORIGIN: http://localhost
          DNDONLINE_DOMAIN: ":80"
      - name: E2E contra producción
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost
